<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Luminant</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <!-- Game layer: canvas + in-game overlays -->
    <div id="game-layer">
      <canvas id="game-canvas"></canvas>
      <div id="overlay-ui">
        <div id="hud" class="hidden"></div>
        <div id="level-up-screen" class="overlay hidden"></div>
        <div id="game-over-screen" class="overlay hidden"></div>
        <button id="debug-toggle" title="Toggle debug overlay (F3)" aria-label="Toggle debug">DEBUG</button>
        <div id="update-banner" class="hidden" role="status">
          <span class="update-banner-text">New version available</span>
          <button type="button" id="update-banner-btn">Reload</button>
        </div>
        <div id="auto-upgrades" class="hidden"></div>
        <div id="upgrade-picker" class="hidden"></div>
        <div id="archetype-picker" class="overlay hidden"></div>
      </div>
      <div id="debug-overlay" class="hidden"></div>
    </div>

    <!-- Menu layer: sits on top of game -->
    <div id="menu-layer" class="overlay"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
