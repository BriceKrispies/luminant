<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luminant — Experiment Lab</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #2a2a3a;
      --text: #c8c8d8;
      --text-dim: #7a7a8a;
      --accent: #6a8cff;
      --accent-dim: #3a5caa;
      --good: #4aba5a;
      --warn: #e8a840;
      --bad: #d84848;
      --font: 'Consolas', 'Monaco', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      font-size: 13px; line-height: 1.5;
    }
    .header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 20px; display: flex; align-items: center; gap: 16px;
    }
    .header h1 { font-size: 16px; color: var(--accent); }
    .header .info { color: var(--text-dim); font-size: 12px; }
    .header button {
      background: var(--accent-dim); color: var(--text); border: none;
      padding: 4px 12px; border-radius: 3px; cursor: pointer; font-family: var(--font);
    }
    .header button:hover { background: var(--accent); }
    .layout { display: flex; height: calc(100vh - 48px); }
    .sidebar {
      width: 260px; min-width: 260px; background: var(--surface);
      border-right: 1px solid var(--border); overflow-y: auto;
    }
    .main { flex: 1; overflow-y: auto; padding: 16px; }

    .tabs {
      display: flex; border-bottom: 1px solid var(--border);
      background: var(--surface); padding: 0 16px;
    }
    .tab {
      padding: 8px 16px; cursor: pointer; color: var(--text-dim);
      border-bottom: 2px solid transparent; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .section-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--text-dim); padding: 8px 12px; border-bottom: 1px solid var(--border);
    }
    .gen-item {
      padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .gen-item:hover { background: #1a1a2a; }
    .gen-item.selected { background: var(--accent-dim); }
    .gen-item .gen-num { font-size: 12px; color: var(--accent); }
    .gen-item .gen-stats { font-size: 11px; color: var(--text-dim); }

    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; padding: 12px; margin-bottom: 12px;
    }
    .panel h3 { font-size: 13px; color: var(--accent); margin-bottom: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .stat { display: flex; justify-content: space-between; padding: 2px 0; }
    .stat .label { color: var(--text-dim); }
    .stat .value { color: var(--text); }

    .reward-bar {
      display: flex; align-items: center; gap: 8px; padding: 3px 0;
    }
    .reward-bar .name { width: 120px; color: var(--text-dim); font-size: 11px; }
    .reward-bar .bar {
      flex: 1; height: 14px; background: #1a1a2a; border-radius: 2px;
      overflow: hidden;
    }
    .reward-bar .bar-fill {
      height: 100%; border-radius: 2px; transition: width 0.3s;
    }
    .reward-bar .bar-fill.positive { background: var(--good); }
    .reward-bar .bar-fill.negative { background: var(--bad); }
    .reward-bar .val { width: 60px; text-align: right; font-size: 11px; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; color: var(--text-dim); padding: 4px 8px; border-bottom: 1px solid var(--border); }
    td { padding: 4px 8px; border-bottom: 1px solid var(--border); }
    tr:hover { background: #1a1a2a; }
    .trend-up { color: var(--good); }
    .trend-down { color: var(--bad); }
    .trend-flat { color: var(--warn); }

    canvas.chart {
      width: 100%; height: 200px; background: #0a0a12;
      border: 1px solid var(--border); border-radius: 3px;
    }
    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text-dim);
    }
    .empty-state h2 { color: var(--text); margin-bottom: 8px; }
    .file-drop {
      border: 2px dashed var(--border); border-radius: 8px;
      padding: 40px; text-align: center; cursor: pointer;
      margin: 20px; transition: border-color 0.2s;
    }
    .file-drop:hover, .file-drop.dragover {
      border-color: var(--accent);
    }
    .candidate-rank {
      display: inline-block; width: 20px; text-align: center;
      color: var(--text-dim); font-size: 11px;
    }
    .candidate-rank.top { color: var(--good); font-weight: bold; }
    .moment-tag {
      display: inline-block; padding: 1px 6px; border-radius: 3px;
      font-size: 10px; margin: 1px 2px;
    }
    .moment-tag.positive { background: #1a3a1a; color: var(--good); }
    .moment-tag.negative { background: #3a1a1a; color: var(--bad); }
    .moment-tag.neutral { background: #2a2a1a; color: var(--warn); }
  </style>
</head>
<body>
  <div class="header">
    <h1>Experiment Lab</h1>
    <span class="info" id="expInfo">No experiment loaded</span>
    <button onclick="loadFiles()">Load Artifacts</button>
    <input type="file" id="fileInput" multiple accept=".json,.jsonl" style="display:none">
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="overview">Overview</div>
    <div class="tab" data-tab="generations">Generations</div>
    <div class="tab" data-tab="candidates">Candidates</div>
    <div class="tab" data-tab="moments">Moments</div>
    <div class="tab" data-tab="convergence">Convergence</div>
    <div class="tab" data-tab="compare">Compare</div>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="section-title">Generations</div>
      <div id="genList"></div>
    </div>
    <div class="main">
      <!-- Overview Tab -->
      <div class="tab-content active" id="tab-overview">
        <div id="overviewContent">
          <div class="file-drop" id="fileDrop">
            <h2>Drop experiment artifacts here</h2>
            <p>Load experiment summary, generation JSONL, or run artifacts</p>
          </div>
        </div>
      </div>

      <!-- Generations Tab -->
      <div class="tab-content" id="tab-generations">
        <div id="generationsContent"></div>
      </div>

      <!-- Candidates Tab -->
      <div class="tab-content" id="tab-candidates">
        <div id="candidatesContent"></div>
      </div>

      <!-- Moments Tab -->
      <div class="tab-content" id="tab-moments">
        <div id="momentsContent"></div>
      </div>

      <!-- Convergence Tab -->
      <div class="tab-content" id="tab-convergence">
        <div id="convergenceContent"></div>
      </div>

      <!-- Compare Tab -->
      <div class="tab-content" id="tab-compare">
        <div id="compareContent"></div>
      </div>
    </div>
  </div>

<script>
// ── State ──
let experiment = null;
let generations = [];
let runs = [];
let selectedGen = null;

// ── Tab switching ──
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
  });
});

// ── File loading ──
function loadFiles() { document.getElementById('fileInput').click(); }

document.getElementById('fileInput').addEventListener('change', e => {
  handleFiles(e.target.files);
});

const drop = document.getElementById('fileDrop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

async function handleFiles(fileList) {
  for (const file of fileList) {
    const text = await file.text();
    if (file.name.endsWith('.jsonl')) {
      const lines = text.trim().split('\n');
      for (const line of lines) {
        try {
          const obj = JSON.parse(line);
          routeArtifact(obj);
        } catch (_) {}
      }
    } else {
      try {
        const obj = JSON.parse(text);
        routeArtifact(obj);
      } catch (_) {}
    }
  }
  render();
}

function routeArtifact(obj) {
  if (obj.type === 'experiment') {
    experiment = obj;
  } else if (obj.type === 'generation') {
    generations.push(obj);
    generations.sort((a, b) => a.generation - b.generation);
  } else if (obj.runId) {
    runs.push(obj);
  } else if (obj.experimentId && obj.config) {
    experiment = obj;
  }
  // Also check for experiment summary with generationHistory
  if (obj.generationHistory) {
    for (const g of obj.generationHistory) {
      if (!generations.find(gg => gg.generation === g.generation)) {
        generations.push({ type: 'generation', ...g });
      }
    }
    generations.sort((a, b) => a.generation - b.generation);
  }
}

// ── Rendering ──
function render() {
  renderInfo();
  renderSidebar();
  renderOverview();
  renderGenerations();
  renderCandidates();
  renderMoments();
  renderConvergence();
  renderCompare();
}

function renderInfo() {
  const el = document.getElementById('expInfo');
  if (experiment) {
    const name = experiment.config?.name || experiment.name || 'Unnamed';
    el.textContent = `${name} | ${generations.length} gens | ${runs.length} runs`;
  } else if (generations.length > 0) {
    el.textContent = `${generations.length} generations | ${runs.length} runs`;
  } else {
    el.textContent = `${runs.length} runs loaded`;
  }
}

function renderSidebar() {
  const list = document.getElementById('genList');
  list.innerHTML = '';
  for (const gen of generations) {
    const item = document.createElement('div');
    item.className = `gen-item${selectedGen === gen.generation ? ' selected' : ''}`;
    item.innerHTML = `
      <div class="gen-num">Generation ${gen.generation}</div>
      <div class="gen-stats">
        best=${(gen.stats?.bestReward || 0).toFixed(1)}
        med=${(gen.stats?.medianReward || 0).toFixed(1)}
      </div>
    `;
    item.onclick = () => {
      selectedGen = gen.generation;
      renderSidebar();
      renderGenerations();
      renderCandidates();
    };
    list.appendChild(item);
  }
}

function renderOverview() {
  const el = document.getElementById('overviewContent');
  if (!experiment && generations.length === 0 && runs.length === 0) return;

  let html = '';

  if (experiment) {
    const cfg = experiment.config || {};
    const res = experiment.result || {};
    html += `<div class="panel"><h3>Experiment Summary</h3>
      <div class="grid-2">
        <div>
          <div class="stat"><span class="label">Name</span><span class="value">${cfg.name || '-'}</span></div>
          <div class="stat"><span class="label">Policy</span><span class="value">${cfg.policyFamily || '-'}</span></div>
          <div class="stat"><span class="label">Population</span><span class="value">${cfg.training?.populationSize || '-'}</span></div>
          <div class="stat"><span class="label">Generations</span><span class="value">${cfg.training?.generations || '-'}</span></div>
        </div>
        <div>
          <div class="stat"><span class="label">Best Reward</span><span class="value">${(res.bestReward || 0).toFixed(1)}</span></div>
          <div class="stat"><span class="label">Total Runs</span><span class="value">${res.totalRuns || runs.length}</span></div>
          <div class="stat"><span class="label">Runs/Candidate</span><span class="value">${cfg.training?.runsPerCandidate || '-'}</span></div>
          <div class="stat"><span class="label">Elites</span><span class="value">${cfg.training?.eliteCount || '-'}</span></div>
        </div>
      </div>
    </div>`;
  }

  // Reward curve
  if (generations.length > 1) {
    html += `<div class="panel"><h3>Reward Curve</h3>
      <canvas class="chart" id="rewardChart"></canvas>
    </div>`;
  }

  el.innerHTML = html;

  if (generations.length > 1) {
    drawRewardChart();
  }
}

function drawRewardChart() {
  const canvas = document.getElementById('rewardChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);
  const w = canvas.offsetWidth;
  const h = canvas.offsetHeight;

  const bests = generations.map(g => g.stats?.bestReward || 0);
  const medians = generations.map(g => g.stats?.medianReward || 0);
  const worsts = generations.map(g => g.stats?.worstReward || 0);

  const allVals = [...bests, ...medians, ...worsts];
  const minY = Math.min(...allVals) - 5;
  const maxY = Math.max(...allVals) + 5;
  const rangeY = maxY - minY || 1;

  ctx.clearRect(0, 0, w, h);

  const pad = { l: 50, r: 20, t: 20, b: 30 };
  const plotW = w - pad.l - pad.r;
  const plotH = h - pad.t - pad.b;

  function toX(i) { return pad.l + (i / Math.max(generations.length - 1, 1)) * plotW; }
  function toY(v) { return pad.t + plotH - ((v - minY) / rangeY) * plotH; }

  // Grid
  ctx.strokeStyle = '#1a1a2a';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (i / 4) * plotH;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#7a7a8a';
    ctx.font = '10px Consolas';
    ctx.fillText((maxY - (i / 4) * rangeY).toFixed(0), 5, y + 3);
  }

  // Lines
  function drawLine(data, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    data.forEach((v, i) => {
      const fn = i === 0 ? 'moveTo' : 'lineTo';
      ctx[fn](toX(i), toY(v));
    });
    ctx.stroke();
  }

  drawLine(worsts, '#d84848');
  drawLine(medians, '#e8a840');
  drawLine(bests, '#4aba5a');

  // Legend
  ctx.font = '10px Consolas';
  const ly = h - 8;
  ctx.fillStyle = '#4aba5a'; ctx.fillText('best', pad.l, ly);
  ctx.fillStyle = '#e8a840'; ctx.fillText('median', pad.l + 50, ly);
  ctx.fillStyle = '#d84848'; ctx.fillText('worst', pad.l + 110, ly);
}

function renderGenerations() {
  const el = document.getElementById('generationsContent');
  if (generations.length === 0) {
    el.innerHTML = '<div class="empty-state"><p>No generation data loaded</p></div>';
    return;
  }

  const gen = selectedGen !== null
    ? generations.find(g => g.generation === selectedGen)
    : generations[generations.length - 1];

  if (!gen) { el.innerHTML = ''; return; }

  let html = `<div class="panel"><h3>Generation ${gen.generation} — Candidates</h3>
    <table>
      <tr><th>Rank</th><th>Name</th><th>Avg Reward</th><th>Best</th><th>Worst</th><th>Runs</th></tr>`;

  for (const c of gen.candidates || []) {
    html += `<tr>
      <td><span class="candidate-rank${c.rank === 0 ? ' top' : ''}">${c.rank + 1}</span></td>
      <td>${c.name}</td>
      <td>${(c.avgReward || 0).toFixed(1)}</td>
      <td>${(c.bestReward || 0).toFixed(1)}</td>
      <td>${(c.worstReward || 0).toFixed(1)}</td>
      <td>${c.runCount || 0}</td>
    </tr>`;
  }

  html += '</table></div>';

  // Generation stats
  const s = gen.stats || {};
  html += `<div class="panel"><h3>Population Stats</h3>
    <div class="grid-3">
      <div class="stat"><span class="label">Mean Reward</span><span class="value">${(s.rewardMean || 0).toFixed(1)}</span></div>
      <div class="stat"><span class="label">Std Dev</span><span class="value">${(s.rewardStdDev || 0).toFixed(2)}</span></div>
      <div class="stat"><span class="label">Diversity</span><span class="value">${(s.diversity || 0).toFixed(3)}</span></div>
    </div>
  </div>`;

  el.innerHTML = html;
}

function renderCandidates() {
  const el = document.getElementById('candidatesContent');
  if (generations.length === 0) {
    el.innerHTML = '<div class="empty-state"><p>No candidate data available</p></div>';
    return;
  }

  const gen = selectedGen !== null
    ? generations.find(g => g.generation === selectedGen)
    : generations[generations.length - 1];

  if (!gen || !gen.candidates || gen.candidates.length === 0) {
    el.innerHTML = '<div class="empty-state"><p>No candidates in selected generation</p></div>';
    return;
  }

  const top = gen.candidates[0];
  if (!top || !top.config) {
    el.innerHTML = '<div class="panel"><h3>Best Candidate</h3><p>No config data available</p></div>';
    return;
  }

  let html = `<div class="panel"><h3>Best Candidate — ${top.name}</h3>
    <div class="stat"><span class="label">Avg Reward</span><span class="value">${(top.avgReward || 0).toFixed(1)}</span></div>
    <h3 style="margin-top:12px">Weight Profile</h3>
    <table><tr><th>Parameter</th><th>Value</th></tr>`;

  const weights = top.config.weights || {};
  for (const [key, val] of Object.entries(weights)) {
    if (key === 'upgradeWeights') continue;
    html += `<tr><td>${key}</td><td>${typeof val === 'number' ? val.toFixed(3) : val}</td></tr>`;
  }

  if (weights.upgradeWeights) {
    for (const [key, val] of Object.entries(weights.upgradeWeights)) {
      html += `<tr><td>upgrade.${key}</td><td>${typeof val === 'number' ? val.toFixed(3) : val}</td></tr>`;
    }
  }

  html += '</table></div>';
  el.innerHTML = html;
}

function renderMoments() {
  const el = document.getElementById('momentsContent');
  // Aggregate moments from runs
  const momentCounts = {};
  for (const run of runs) {
    const events = run.events || [];
    for (const evt of events) {
      if (evt.type && evt.type !== 'wave_change' && evt.type !== 'level_up' && evt.type !== 'death' && evt.type !== 'damage_spike') {
        momentCounts[evt.type] = (momentCounts[evt.type] || 0) + 1;
      }
    }
  }

  if (Object.keys(momentCounts).length === 0) {
    el.innerHTML = '<div class="empty-state"><p>No moment data in loaded runs</p></div>';
    return;
  }

  let html = '<div class="panel"><h3>Moment Frequency</h3><table><tr><th>Moment</th><th>Count</th><th>Per Run</th></tr>';
  const sorted = Object.entries(momentCounts).sort((a, b) => b[1] - a[1]);
  for (const [id, count] of sorted) {
    html += `<tr><td>${id}</td><td>${count}</td><td>${(count / Math.max(runs.length, 1)).toFixed(2)}</td></tr>`;
  }
  html += '</table></div>';
  el.innerHTML = html;
}

function renderConvergence() {
  const el = document.getElementById('convergenceContent');
  if (generations.length < 2) {
    el.innerHTML = '<div class="empty-state"><p>Need at least 2 generations for convergence analysis</p></div>';
    return;
  }

  const bests = generations.map(g => g.stats?.bestReward || 0);
  const medians = generations.map(g => g.stats?.medianReward || 0);
  const diversities = generations.map(g => g.stats?.diversity || 0);

  // Simple trend
  const bestTrend = bests[bests.length - 1] - bests[0];
  const medianTrend = medians[medians.length - 1] - medians[0];
  const divTrend = diversities[diversities.length - 1] - diversities[0];

  let trend = 'mixed';
  if (bestTrend > 5 && medianTrend > 3) trend = 'improving';
  else if (Math.abs(bestTrend) < 2 && Math.abs(medianTrend) < 2) trend = 'stagnating';
  else if (bestTrend > 3 && medianTrend < -2) trend = 'overfitting';
  else if (bestTrend < -3) trend = 'collapsing';

  const trendClass = {
    improving: 'trend-up', stagnating: 'trend-flat',
    overfitting: 'trend-down', collapsing: 'trend-down', mixed: 'trend-flat',
  }[trend];

  let html = `<div class="panel"><h3>Convergence Analysis</h3>
    <div class="grid-3">
      <div class="stat"><span class="label">Trend</span><span class="value ${trendClass}">${trend}</span></div>
      <div class="stat"><span class="label">Best Delta</span><span class="value">${bestTrend.toFixed(1)}</span></div>
      <div class="stat"><span class="label">Diversity Delta</span><span class="value">${divTrend.toFixed(4)}</span></div>
    </div>
  </div>`;

  // Per-generation table
  html += `<div class="panel"><h3>Generation History</h3>
    <table><tr><th>Gen</th><th>Best</th><th>Median</th><th>Worst</th><th>Diversity</th></tr>`;
  for (const gen of generations) {
    const s = gen.stats || {};
    html += `<tr>
      <td>${gen.generation}</td>
      <td>${(s.bestReward || 0).toFixed(1)}</td>
      <td>${(s.medianReward || 0).toFixed(1)}</td>
      <td>${(s.worstReward || 0).toFixed(1)}</td>
      <td>${(s.diversity || 0).toFixed(4)}</td>
    </tr>`;
  }
  html += '</table></div>';

  el.innerHTML = html;
}

function renderCompare() {
  const el = document.getElementById('compareContent');
  if (generations.length < 2) {
    el.innerHTML = '<div class="empty-state"><p>Need at least 2 generations to compare</p></div>';
    return;
  }

  // Compare generation winners
  const winners = generations
    .filter(g => g.candidates && g.candidates.length > 0)
    .map(g => ({
      generation: g.generation,
      name: g.candidates[0].name,
      avgReward: g.candidates[0].avgReward,
    }));

  let html = '<div class="panel"><h3>Generation Winners</h3><table><tr><th>Gen</th><th>Winner</th><th>Reward</th><th>Delta</th></tr>';
  for (let i = 0; i < winners.length; i++) {
    const w = winners[i];
    const delta = i > 0 ? w.avgReward - winners[i - 1].avgReward : 0;
    const cls = delta > 0 ? 'trend-up' : delta < 0 ? 'trend-down' : '';
    html += `<tr>
      <td>${w.generation}</td>
      <td>${w.name}</td>
      <td>${(w.avgReward || 0).toFixed(1)}</td>
      <td class="${cls}">${i > 0 ? (delta >= 0 ? '+' : '') + delta.toFixed(1) : '-'}</td>
    </tr>`;
  }
  html += '</table></div>';

  el.innerHTML = html;
}
</script>
</body>
</html>
