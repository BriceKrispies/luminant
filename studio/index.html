<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creature Studio</title>
  <style>
    :root {
      --studio-font: 'Segoe UI', system-ui, sans-serif;
      --studio-accent: #5a8abf;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--studio-font);
      background: #111;
      color: #ccc;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Viewport ── */
    #viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0e;
      position: relative;
    }
    #canvas {
      image-rendering: pixelated;
      cursor: default;
    }
    #viewport-info {
      position: absolute;
      bottom: 8px; left: 12px;
      font-size: 11px; color: #555;
    }
    #viewport-zoom {
      position: absolute;
      top: 10px; right: 10px;
      font-size: 11px; color: #666;
      background: rgba(0,0,0,0.5);
      padding: 3px 8px; border-radius: 3px;
      pointer-events: none;
      opacity: 0; transition: opacity 0.3s;
    }
    #viewport-zoom.visible { opacity: 1; }

    /* ── Inspector panel ── */
    #inspector {
      width: 300px;
      background: #1a1a1e;
      border-left: 1px solid #333;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #inspector::-webkit-scrollbar       { width: 6px; }
    #inspector::-webkit-scrollbar-track { background: transparent; }
    #inspector::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    #inspector > h1 {
      font-size: 14px; font-weight: 700;
      color: #eee; padding: 4px 2px 6px;
    }

    /* ── Light-DOM helpers (inside panels via slot) ── */
    .section-label {
      display: block;
      font: 600 10px/1 var(--studio-font);
      text-transform: uppercase; letter-spacing: 0.4px;
      color: #666; margin: 4px 0 2px;
    }
    .action-row {
      display: flex; gap: 3px; flex-wrap: wrap;
    }
    .action-btn {
      padding: 4px 8px;
      background: #2a2a30; border: 1px solid #444; border-radius: 3px;
      color: #ccc; font: 11px var(--studio-font);
      cursor: pointer; transition: all 0.1s;
    }
    .action-btn:hover { background: #3a3a42; border-color: #666; }
    .action-btn[aria-pressed="true"] {
      background: #3a5a8a; border-color: #5a8abf; color: #fff;
    }
    .action-btn.accent { background: #5a3a2a; border-color: #8a5a3a; }
    .action-btn.accent:hover { background: #6a4a3a; }
    #prog-output {
      font-size: 9px; color: #777; line-height: 1.3;
      white-space: pre-wrap;
      background: #111; padding: 6px; border-radius: 3px;
      max-height: 160px; overflow-y: auto;
    }
  </style>
</head>
<body>
  <!-- Viewport -->
  <div id="viewport">
    <canvas id="canvas" width="600" height="600"></canvas>
    <output id="viewport-info">--</output>
    <output id="viewport-zoom">5x</output>
  </div>

  <!-- Inspector -->
  <aside id="inspector">
    <h1>Creature Studio</h1>

    <!-- Creature -->
    <studio-panel label="Creature">
      <studio-select  name="archetypeId" label="Archetype"></studio-select>
      <studio-slider  name="radius"     label="Radius"  min="6" max="40" value="14" format="0"></studio-slider>
      <studio-slider  name="hpFraction" label="HP"       min="0" max="1" step="0.05" value="1" format="%"></studio-slider>
      <studio-slider  name="facing"     label="Facing"   min="0" max="6.28" step="0.05" value="0" format="2"></studio-slider>
      <studio-select  name="expression" label="Expression">
        <option value="neutral" selected>Neutral</option>
        <option value="angry">Angry</option>
        <option value="surprised">Surprised</option>
        <option value="hurt">Hurt</option>
        <option value="dead">Dead</option>
        <option value="focused">Focused</option>
      </studio-select>
      <studio-toggle  name="autoExpression" label="Auto-detect from anim" checked></studio-toggle>
      <studio-slider  name="pupilX" label="Pupil X" min="-1" max="1" step="0.05" value="0" format="2"></studio-slider>
      <studio-slider  name="pupilY" label="Pupil Y" min="-1" max="1" step="0.05" value="0" format="2"></studio-slider>
    </studio-panel>

    <!-- Animation -->
    <studio-panel label="Animation">
      <studio-select name="animState" label="State">
        <option value="idle" selected>Idle</option>
        <option value="locomotion">Move</option>
        <option value="attack">Attack</option>
        <option value="hit_react">Hit</option>
        <option value="dying">Die</option>
      </studio-select>
      <studio-toggle name="loopOneShot" label="Loop one-shots" checked></studio-toggle>
      <span class="section-label">Playback</span>
      <div class="action-row" id="playback-actions">
        <button class="action-btn" data-action="play" aria-pressed="true">Play</button>
        <button class="action-btn" data-action="pause" aria-pressed="false">Pause</button>
        <button class="action-btn accent" data-action="replay">Replay</button>
      </div>
      <studio-slider name="speed" label="Speed" min="0" max="3" step="0.1" value="1" format="1|x"></studio-slider>
      <studio-slider name="scrub" label="Scrub" min="0" max="1" step="0.005" value="0" format="%" disabled></studio-slider>
      <studio-toggle name="showAll" label="Show all side-by-side"></studio-toggle>
    </studio-panel>

    <!-- View & Debug -->
    <studio-panel label="View & Debug">
      <studio-slider name="zoom" label="Zoom" min="1" max="20" step="0.5" value="5" format="x"></studio-slider>
      <studio-select name="bg" label="Background">
        <option value="dark" selected>Dark</option>
        <option value="light">Light</option>
        <option value="checker">Checker</option>
        <option value="game">Game</option>
      </studio-select>
      <span class="section-label">Overlays</span>
      <studio-toggle name="showBones" label="Bones"></studio-toggle>
      <studio-toggle name="showNames" label="Bone names"></studio-toggle>
      <studio-toggle name="showSlots" label="Slot order"></studio-toggle>
      <studio-toggle name="showGrid"  label="Origin grid"></studio-toggle>
      <studio-bone-list name="boneVisibility" hidden></studio-bone-list>
    </studio-panel>

    <!-- Progression -->
    <studio-panel label="Progression">
      <studio-toggle name="progEnabled" label="Enable progression" checked></studio-toggle>
      <studio-slider name="level"      label="Level"       min="1" max="60" value="1" format="0"></studio-slider>
      <studio-slider name="xpProgress" label="XP Progress" min="0" max="1" step="0.01" value="0" format="%"></studio-slider>
      <studio-slider name="entitySeed" label="Seed"        min="0" max="1" step="0.01" value="0.5" format="2"></studio-slider>
      <div class="action-row">
        <button class="action-btn accent" data-action="burst">Trigger Burst</button>
      </div>
      <span class="section-label">Effect Toggles</span>
      <studio-toggle name="progGlow"     label="Glow" checked></studio-toggle>
      <studio-toggle name="progTendrils" label="Tendrils" checked></studio-toggle>
      <studio-toggle name="progHalo"     label="Halo / Crown" checked></studio-toggle>
      <studio-toggle name="progBurst"    label="Level-up Burst" checked></studio-toggle>
      <span class="section-label">Debug</span>
      <pre id="prog-output">--</pre>
    </studio-panel>
  </aside>

  <script type="module" src="./studio.js"></script>
</body>
</html>
