<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creature Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #111;
      color: #ccc;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #canvas-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0e;
      position: relative;
    }
    #creature-canvas {
      image-rendering: pixelated;
    }
    #canvas-info {
      position: absolute;
      bottom: 8px;
      left: 12px;
      font-size: 11px;
      color: #555;
    }

    #panel {
      width: 320px;
      background: #1a1a1e;
      border-left: 1px solid #333;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 2px;
    }
    .btn-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 5px 10px;
      background: #2a2a30;
      border: 1px solid #444;
      border-radius: 4px;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.1s;
    }
    .btn:hover { background: #3a3a42; border-color: #666; }
    .btn.active { background: #3a5a8a; border-color: #5a8abf; color: #fff; }
    .btn.accent { background: #5a3a2a; border-color: #8a5a3a; }
    .btn.accent:hover { background: #6a4a3a; }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .slider-row label {
      font-size: 12px;
      width: 80px;
      flex-shrink: 0;
    }
    .slider-row input[type="range"] {
      flex: 1;
      accent-color: #5a8abf;
    }
    .slider-row .value {
      font-size: 11px;
      color: #888;
      width: 40px;
      text-align: right;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .toggle-row input[type="checkbox"] {
      accent-color: #5a8abf;
    }

    hr { border: none; border-top: 1px solid #333; }
  </style>
</head>
<body>
  <div id="canvas-area">
    <canvas id="creature-canvas" width="600" height="600"></canvas>
    <div id="canvas-info">--</div>
  </div>

  <div id="panel">
    <div style="font-size: 16px; font-weight: 700; color: #eee;">Creature Studio</div>

    <div class="section">
      <div class="section-title">Archetype</div>
      <div class="btn-row" id="archetype-btns">
        <!-- populated from ARCHETYPES by studio.js -->
      </div>
    </div>

    <div class="section">
      <div class="section-title">Animation State</div>
      <div class="btn-row" id="anim-btns">
        <button class="btn active" data-id="idle">Idle</button>
        <button class="btn" data-id="locomotion">Move</button>
        <button class="btn" data-id="attack">Attack</button>
        <button class="btn" data-id="hit_react">Hit</button>
        <button class="btn" data-id="dying">Die</button>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="loop-oneshot" checked>
        <label for="loop-oneshot">Loop one-shot animations</label>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Playback</div>
      <div class="btn-row">
        <button class="btn active" id="play-btn">Play</button>
        <button class="btn" id="pause-btn">Pause</button>
        <button class="btn accent" id="replay-btn">Replay</button>
      </div>
      <div class="slider-row">
        <label>Speed</label>
        <input type="range" id="speed-slider" min="0" max="3" step="0.1" value="1">
        <span class="value" id="speed-val">1.0x</span>
      </div>
      <div class="slider-row">
        <label>Scrub</label>
        <input type="range" id="scrub-slider" min="0" max="1" step="0.005" value="0" disabled>
        <span class="value" id="scrub-val">0%</span>
      </div>
    </div>

    <hr>

    <div class="section">
      <div class="section-title">Expression</div>
      <div class="btn-row" id="expr-btns">
        <button class="btn active" data-id="neutral">Neutral</button>
        <button class="btn" data-id="angry">Angry</button>
        <button class="btn" data-id="surprised">Surprised</button>
        <button class="btn" data-id="hurt">Hurt</button>
        <button class="btn" data-id="dead">Dead</button>
        <button class="btn" data-id="focused">Focused</button>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="auto-expression" checked>
        <label for="auto-expression">Auto-detect from anim state</label>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Pupil Bias</div>
      <div class="slider-row">
        <label>X</label>
        <input type="range" id="pupil-x" min="-1" max="1" step="0.05" value="0">
        <span class="value" id="pupil-x-val">0</span>
      </div>
      <div class="slider-row">
        <label>Y</label>
        <input type="range" id="pupil-y" min="-1" max="1" step="0.05" value="0">
        <span class="value" id="pupil-y-val">0</span>
      </div>
    </div>

    <hr>

    <div class="section">
      <div class="section-title">Entity</div>
      <div class="slider-row">
        <label>Radius</label>
        <input type="range" id="radius-slider" min="6" max="40" step="1" value="14">
        <span class="value" id="radius-val">14</span>
      </div>
      <div class="slider-row">
        <label>HP</label>
        <input type="range" id="hp-slider" min="0" max="1" step="0.05" value="1">
        <span class="value" id="hp-val">100%</span>
      </div>
      <div class="slider-row">
        <label>Facing</label>
        <input type="range" id="facing-slider" min="0" max="6.28" step="0.05" value="0">
        <span class="value" id="facing-val">0</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">View</div>
      <div class="slider-row">
        <label>Zoom</label>
        <input type="range" id="zoom-slider" min="1" max="12" step="0.5" value="5">
        <span class="value" id="zoom-val">5x</span>
      </div>
      <div class="btn-row" id="bg-btns">
        <button class="btn active" data-id="dark">Dark</button>
        <button class="btn" data-id="light">Light</button>
        <button class="btn" data-id="checker">Checker</button>
        <button class="btn" data-id="game">Game</button>
      </div>
    </div>

    <hr>

    <div class="section">
      <div class="section-title">Debug</div>
      <div class="toggle-row">
        <input type="checkbox" id="show-bones">
        <label for="show-bones">Show bones</label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="show-names">
        <label for="show-names">Show bone names</label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="show-slots">
        <label for="show-slots">Show slot order</label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="show-grid">
        <label for="show-grid">Show origin grid</label>
      </div>
    </div>

    <div class="section">
      <div class="section-title">All Archetypes</div>
      <div class="toggle-row">
        <input type="checkbox" id="show-all">
        <label for="show-all">Show all side-by-side</label>
      </div>
    </div>
  </div>

  <script type="module" src="./studio.js"></script>
</body>
</html>
